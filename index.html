          /* storage blocked — fall through to the OS preference */
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        /* slider position: 0 = dark (top) · 1 = light (bottom) */

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {

rise architecture and modernization",chapter:"chapter-5-architect"}],ef={intro:"Six short stages, about five minutes. Skip it at any point — the question-answering experience is always there.",stages:[{id:"who-i-am",label:"Who I am",heading:"A hands-on technology architect, with over two decades of industry experience",body:"I am a Senior Technology Architect with {{experience}} across software engineering, frontend architecture, technical leadership and enterprise modernization. I sit between business, product and engineering: I turn ambiguous requirements into outcomes, and I stay close enough to the code to know whether an architecture actually holds. The work ranges wider than frontend: an architecture has to hold across the user experience, the frontend structure, the API contracts and backend integration behind it, the cloud infrastructure it lands on, and the performance people actually feel. Trained in design, I read an interface with the same care I give an architecture.",action:{label:"Early Career",target:"next"}},{id:"where-i-started",label:"Where I started",heading:"It began with software that taught people.",body:"My first years were in educational content creation: building the graphics, animations, games and videos that made a lesson work, and packaging the whole thing through CD-ROM for national and international clients. Multimedia programming then meant being user experience, engineering and packaging in one role — interactive 3D presentations, rich-media websites and CD-ROM applications, with every asset hand-fitted to what the disc could carry. That constraint taught me something I still practice: the medium’s limits are part of the design, and “works” only counts when it works for the person in front of it. From there, moving into product engineering and e-learning platforms — Brainvisa, Digital Domain, NIIT, Aptara — was the same craft scaled into products.",action:{label:"How I evolved",target:"next"}},{id:"how-i-evolved",label:"How I evolved",heading:"Multiple phases, one continuous craft",body:"2002–2005 multimedia programming — educational content made of graphics, games, video, packaged on CD-ROM — which taught me to combine programming with user experience. 2005–2012 product engineering and e-learning platforms — plugins and extensions among them — which taught me the whole delivery lifecycle. 2012–2017 remote individual contracting for international customers — e-learning courseware and Flash-based legacy products converted to newer technology. 2017–2021 frontend engineering, UI/UX and technical leadership. From November 2021, enterprise modernization and business-aligned architecture as a Senior Architect.",action:{label:"Career narrative",target:"career"}},{id:"what-i-delivered",label:"What I delivered",heading:"Recent engagements",body:"A React modernization proof of concept on a legacy health-insurance application, which proved a slice could move without pausing the business. A cloud-onboarding and remote-visualization evaluation for a chromatography data system in scientific labs. And the frontend architecture for a genetic-testing platform, which had to make very large data volumes something a scientist could actually work with. Behind all three sits one habit: asking not only whether a solution works today, but whether it stays maintainable, performant and useful to the business over time.",action:{label:"Explore projects",target:"projects"}},{id:"how-i-work",label:"How I work",heading:"Architectural thinking with hands-on engineering",body:"I establish the approach, set the guardrails, work the trade-offs with the team, and stay in the implementation when the design needs proving. Design is a working tool for me, not decoration: my foundation in UX and human–computer interaction means requirements turn into flows and system sketches before they turn into code, design thinking shapes how I approach them, and accessibility is part of the same craft — from semantic structure to a working command of the ARIA standards that make an interface genuinely usable. With clients I work the same way — embedding, shaping requirements against real constraints, and leaving behind something the team can sustain rather than a document nobody opens.",action:{label:"Leadership skills",target:"ask",query:"Leadership"}},{id:"where-heading",label:"Where I am heading",heading:"Technical leadership with AI-assisted delivery",body:"I am working towards where I can act as an enabler for the team and the customer — owning end-to-end solutioning, and using AI agent harnesses as a force multiplier without giving up the human review keeping quality intact. The habit I bring to a team is the same one I keep practicing: small plugins I build for the tools I use day to day, and weekend experiments with Linux on a Raspberry Pi — a low-stakes place to meet the technology the work often adopts later. If that sounds like the kind of team you are building, I would like to hear from you.",action:{label:"Reach out",target:"contact"}}]},tf={match:["hi","hii","hey","hiya","yo","howdy","namaste","hello","greetings","good morning","good afternoon","good evening","hey there","hi there","hello there","how are you","hows it going","how is it going","how have you been","nice to meet you","good to see you","anything new"],answer:"Hi — I'm Ashim. Ask me anything about my career, stack, domains, or about my experience — my @bot would answer. Alternately tap a suggestion to get details or reach out to me directly.",followups:["Introduction","Current work","Career path","Open to work"]},nf=[{id:"compensation",title:"Compensation",match:["salary","salaries","ctc","compensation","remuneration","pay","pay package","package","pay scale","how much does he earn","how much do you earn","what is his salary","what is your salary","expected salary","current salary","salary expectation","salary expectations","lpa","per annum","per month pay","bonus","perks","pay slip","increment","raise","hike"],answer:"I can't share compensation details — that's confidential on both sides of any offer, and it isn't something I put in an interactive resume. Reach me directly on email or phone and I'll take it from there.",followups:["Open to work","Current work"]},{id:"client-confidentiality",title:"Client Confidentiality",match:["which client","who was the client","who is the client","client name","customer name","who is the customer","name of the client","which company did he work for","which company did you work for","which payer","which healthcare company","which startup","nda","under nda","non disclosure","is it confidential"],answer:"Client names aren't mine to share — Persistent's policy is not to reveal customer identities. I can go into as much detail as you like on the scope, the domain, the stack and the outcomes, without naming anyone.",followups:["Current work","Projects"]}],sf=JSON.parse(`{"about":{"label":"About","entries":[{"id":"about-me","title":"About me","aliases":["explore career path","about me","who are you","who is ashim","tell me about yourself","introduce","yourself","overview","summary","which one are you","what have you been up to","background","bio","walk me through your career","walk me through his career","tell me about his career","career path","career journey","career so far","give me a rundown","tell me about your career","introduction","how would he pitch himself","how does he describe himself","positioning","elevator pitch","pitch","introduce him in one line","one line summary","how should i describe him","professional summary","profile line","value proposition","what is his professional identity","the pitch","default pitch","primary pitch","how does he introduce himself professionally","modernization pitch","pitch for a modernization role","digital transformation pitch","application modernization pitch","legacy modernization pitch","how would he pitch himself for a modernization role","leadership pitch","pitch for an engineering leadership role","principal engineer pitch","technical leadership pitch","engineering leader pitch","how would he pitch himself for a leadership role","business facing pitch","presales pitch","client facing pitch","advisory pitch","solution consulting pitch","how would he pitch himself for a client-facing role","how do you pitch yourself","how do you describe yourself","introduce yourself in one line","how should i describe you","what is your professional identity","how do you introduce yourself professionally","your pitch"],"tags":["career"],"answer":"Practicing software engineering, frontend architecture and enterprise application modernization over two decades both in product and services environments spanning healthcare, e-learning and e-commerce. Much of that work has been the same job at different scales: taking legacy enterprise estates — applications that had to keep running while they changed — and moving them onto a secure, scalable architecture without pausing the business that depends on them. \\n\\nI have helped turned complex modernization goals into production-ready systems. I hold architecture and hands-on engineering in the same pair of hands: involved in the plumbing and scaffolding, defining HLD and LLD, shape the REST and GraphQL APIs and the application UI integrations, get the foundation code reviewed ensuring the design survives when it reaches the prod base. In addition help with the integrations as how it deploys on cloud platforms, maintaining scope, observing how it matures and performs over time. \\n\\nI read the process end to end — the SDLC, which today shifting towards ADLC: understaing the narrative and gathering requirements, checking feasibility, defining architecture, consolidating the build and integration, ensuring test and release through through quality checks, deployment and operations, and iterating on the customer feedback that starts the next cycle. With AI, LLM tooling and agentic harnesses now working inside that cycle, I treat every stage as augmentable, with human review as the quality gate. \\n\\nKeeping up with current technologies is a working habit that I am living day in day out, the habit what lets me help teams define both strategic and tactical shifts. What I bring going forward is a practical blend: strategic architecture, hands-on execution, clear communication and the discipline to deliver change with minimal disruption. I focus on structure first — because getting that right is what lets teams move faster and systems scale with confidence.","pitch":"I am a hands-on technology architect who evolved from building interactive digital experiences to designing and modernizing complex enterprise applications.","followups":["Current work","Employment","Competencies"],"related":["chapter-5-architect","current-persistent","ai-toolset","open-to-work"]}]},"positioning":{"label":"Positioning","entries":[{"id":"positioning","title":"About me","aliases":["explore career path","about me","who are you","who is ashim","tell me about yourself","introduce","yourself","overview","summary","which one are you","what have you been up to","background","bio","walk me through your career","walk me through his career","tell me about his career","career path","career journey","career so far","give me a rundown","tell me about your career","introduction","how would he pitch himself","how does he describe himself","positioning","elevator pitch","pitch","introduce him in one line","one line summary","how should i describe him","professional summary","profile line","value proposition","what is his professional identity","the pitch","default pitch","primary pitch","how does he introduce himself professionally","modernization pitch","pitch for a modernization role","digital transformation pitch","application modernization pitch","legacy modernization pitch","how would he pitch himself for a modernization role","leadership pitch","pitch for an engineering leadership role","principal engineer pitch","technical leadership pitch","engineering leader pitch","how would he pitch himself for a leadership role","business facing pitch","presales pitch","client facing pitch","advisory pitch","solution consulting pitch","how would he pitch himself for a client-facing role","how do you pitch yourself","how do you describe yourself","introduce yourself in one line","how should i describe you","what is your professional identity","how do you introduce yourself professionally","your pitch"],"tags":["profile"],"answer":"I’m Ashim Saha — a Senior Technology Architect with {{experience}} of turning complex, legacy enterprise estates into secure, scalable, modular and high-performance systems that are built to last.\\n\\nI define and drive software architecture end-to-end — from High-Level and Low-Level Designs to scalable REST and GraphQL APIs, React/Next.js integrations, and cloud-native deployments across AWS, Azure and GCP. I write the code everyone builds on, review the pull requests that matter, and stay hands-on to keep architectural intent grounded in reality.\\n\\nMy track record spans healthcare, e-learning and e-commerce, where I've modernized platforms without pausing the business. I focus on the harder part: balancing business needs against technical debt, navigating conflicting priorities, making pragmatic trade-offs with long-term impact in mind, negotiating scope and deadlines, and defending those choices with real data. I bring product, engineering, sales and leadership together — explaining the same design clearly to each audience and aligning it to a realistic, outcome-driven roadmap.\\n\\nBeyond shipping, I raise the bar — mentoring developers and technical leads, enforcing sound engineering standards, tracking RFCs and release notes, and driving adoption of GenAI, LLMs, RAG pipelines, embeddings, vector databases and agentic frameworks only where they solve a real problem. I also hold a sharp eye on risk, performance, reliability and compliance with quality and healthcare regulatory standards.\\n\\nWhat I bring going forward is a practical blend: strategic architecture, hands-on execution, clear communication and the discipline to deliver change with minimal disruption. I focus on structure first — because getting that right is what lets teams move faster and systems scale with confidence.","followups":["Career path","Current work","Employment","Competencies"],"related":["chapter-5-architect","current-persistent","ai-toolset","open-to-work"]},{"id":"capabilities","title":"Core Competencies","aliases":["what are his core competencies","capabilities","what is he good at","key skills","areas of expertise","strengths","what does he bring","competency areas","what are his strengths","what do you bring","what do you bring in","what can you bring","your strengths","your key skills"],"tags":["core competencies"],"answer":"My strengths run from solution and enterprise architecture through frontend engineering, performance work and engineering practices, out to disciplined delivery and regulatory awareness — with healthcare, e-learning and e-commerce domain experience along the way. The table carries the specifics; the through-line is the same pairing of architectural thinking with hands-on engineering.","followups":["Tech stack","Leadership","Projects"],"related":["positioning","core-stack","soft-skills","selected-evidence"],"table":[{"term":"Architecture & scale","value":"Solid grounding in software-architecture principles and large-scale application design, applied to architecting systems that stay scalable, maintainable and performant."},{"term":"Performance & craft","value":"Design patterns, engineering best practices and performance optimization techniques — applied through debugging, profiling, performance analysis and troubleshooting of complex systems."},{"term":"Frontend & modernization","value":"Solution and frontend architecture; enterprise modernization; React and modern web technologies; UI/UX and application usability; presales — evaluations, RFPs and proofs of concept."},{"term":"Collaboration & people engagement","value":"Strong analytical, problem-solving and decision-making capability; excellent communication, leadership and stakeholder management; mentoring development teams and providing technical leadership across multiple initiatives."},{"term":"Delivery discipline","value":"Proficiency with Git and modern configuration management; Agile and Scrum delivery; DevOps practice with CI/CD pipelines; Docker and containerized development; cloud-native architectures and modern deployment models."},{"term":"Domains","value":"Experienced in healthcare, e-learning and e-commerce, working consistently with a product-based mindset."},{"term":"Compliance","value":"Working understanding of software compliance, quality standards and the regulatory requirements for medical applications."}]}]},"professionalStory":{"label":"The Career Story","entries":[{"id":"chapter-1-foundation","title":"The Foundation — Building Interactive Digital Experiences (2002–2005)","theme":"The foundation — building interactive digital experiences","aliases":["chapter 1","how did he start","how did he begin his career","start of his career","early years","multimedia programming","cd-rom","3d presentations","interactive experiences","foundation","2002 to 2005","first five years","how did he begin"],"tags":["career"],"answer":"2002–2005 | Multimedia programming and interactive applications. My career began with multimedia programming — interactive 3D presentations, CD-ROM applications and rich-media websites for national and international clients. I developed interactive and multimedia applications, created educational content and rich-media experiences, and combined visual design concepts with programming, building a foundation in user interaction and digital experiences. I started at the intersection of technology and visual communication, which gave me an early appreciation for how software should behave from the user's perspective, not just how it should work technically.","pitch":"My career began with interactive multimedia applications, where I learned to combine programming with user experience. That foundation shaped my approach to software engineering: technology should solve a problem while making the experience intuitive for the user.","followups":["Employment","Projects","Education"],"related":["chapter-2-product","emp-early-career","education"]},{"id":"chapter-2-product","title":"The Product Mindset — From Development to Technical Leadership (2005–2012)","theme":"The product mindset — from development to technical leadership","aliases":["chapter 2","product mindset","product engineering","2005 to 2012","brainvisa","encora","digital domain","niit","aptara","rapidel","e-learning product","media center","from development to leadership"],"tags":["career"],"answer":"2005–2012 | Product engineering, e-learning platforms and team leadership. At Brainvisa Technologies (now Encora), Digital Domain India, NIIT and Aptara my work expanded from building individual experiences into product engineering. I contributed to RapideL, an e-learning automation product that fed Word content into Flash courseware; built interactive simulations and game-based learning applications; developed the Media-Center desktop product; and supported technical solutions and business development for e-learning engagements, including an in-house training academy for a global audit-and-advisory firm. My responsibilities extended beyond implementation into technical management, solution development, quality reviews and collaboration with business stakeholders.","pitch":"As I progressed, I moved from building individual applications to working on products and reusable platforms. That taught me the complete development lifecycle — technical design, quality, team collaboration, and delivering solutions that meet business needs.","followups":["Employment","Projects","Leadership"],"related":["chapter-1-foundation","chapter-3-transformation","emp-early-career"]},{"id":"chapter-3-transformation","title":"The Transformation — Legacy Modernization and Independent Solutioning (2012–2017)","theme":"The transformation — legacy modernization and independent solutioning","aliases":["chapter 3","transformation","consulting years","freelance years","independent years","2012 to 2017","flash modernization","legacy modernization story","individual contractor","modernization chapter","remote contractor"],"tags":["career","modernization"],"answer":"2012–2017 | Remote individual contracting, e-learning courseware and Flash-to-modern conversion. For five years I worked as an individual contractor, fully remote, for international customers — reached through global freelance marketplaces as well as direct contracts, across media and entertainment, banking, academic publishing, workforce software, insurance brokerage and market research. The prime work came in two shapes. E-learning courseware development was a natural continuation of where I started: building the lesson experiences, graphics and interactions that made courses work for learners. Converting Flash-based legacy products to their newer technology counterparts was the era-defining brief — and it demanded the same discipline every time: understand what the legacy product actually did for its users and its business, map the behaviour precisely, and rebuild it so the functionality carried over intact while the technology underneath moved forward. Working independently, across time zones and unfamiliar client environments, taught me to assess existing systems quickly, scope without supervision, and communicate tightly where delivery rested entirely on me. This period bridged my multimedia background and the frontend architecture specialization that followed.","pitch":"My consulting years taught me to deliver without supervision, in environments I did not create. The recurring work — e-learning courseware and Flash-based legacy products converted to newer technology — was never about replacing old tech for its own sake: it preserved business functionality while improving the underlying user experience and technical implementation.","followups":["Employment","Modernization","Domains"],"related":["chapter-2-product","chapter-4-specialization","emp-freelance","current-modernization"]},{"id":"chapter-4-specialization","title":"The Specialization — Frontend Engineering, UX and Technical Leadership (2017–2021)","theme":"The specialization — frontend engineering, UX and technical leadership","aliases":["chapter 4","specialization","2017 to 2021","wizard communication","conscience it","e-commerce products","ui ux leadership","raspberry pi","moodle","blackboard","industry 4.0","frontend leadership"],"tags":["career","leadership"],"answer":"2017–2021 | Frontend engineering, UX and technical leadership. At Conscience IT and Wizard Communication I took on broader responsibilities — leading frontend developers, developing custom e-commerce and healthcare products, evaluating technologies and making implementation decisions, building e-learning plugins and simulations, working with Moodle and Blackboard, and supporting applications for desktop environments and resource-constrained devices such as Raspberry Pi. Frontend development became more than implementing screens: it involved selecting appropriate technologies, organizing development, evaluating trade-offs, and ensuring the solution met user and business requirements.","pitch":"Over time frontend engineering became my core specialization. I moved beyond implementation into UI architecture, technology evaluation, team leadership and solution design — increasingly focused on simplifying complex requirements and creating maintainable applications across platforms.","followups":["Employment","Leadership","Tech stack"],"related":["chapter-3-transformation","chapter-5-architect","emp-wizard-conscience","soft-skills"]},{"id":"chapter-5-architect","title":"The Architect — Enterprise Modernization and Business-Aligned Technology (Nov 2021–present)","theme":"The architect — enterprise modernization and business-aligned technology","aliases":["chapter 5","architect chapter","2021 to present","senior architect","persistent","enterprise modernization","business aligned technology","presales","rfp","architectural advisor","current chapter","recent chapter"],"tags":["career"],"answer":"November 2021 – present | Senior Architect, Persistent Systems. My current role brings together every strand of the career. The work spans healthcare and life sciences, BFSI, enterprise modernization, product development, UI migrations, presales evaluations and RFP-driven proposals. I design frontend solutions and establish engineering practices; move legacy applications toward modern interfaces and architectures; translate business and product requirements into technical approaches; connect business expectations with engineering decisions; and support teams through implementation and technical problem-solving. I act as an architectural advisor while contributing hands-on when necessary — through proofs of concept, technical evaluations and RFP responses.","pitch":"Today I operate at the intersection of architecture, engineering and business. I help teams modernize applications, make sound technology decisions, and translate complex requirements into practical solutions. My strength is combining architectural thinking with hands-on engineering and stakeholder collaboration to deliver maintainable, user-focused software.","followups":["Current work","Projects","Modernization"],"related":["chapter-4-specialization","current-persistent","emp-persistent","open-to-work"]}]},"currentUndertaking":{"label":"Current Undertaking","entries":[{"id":"role-responsibilities","title":"The Architect Role — What I Own","aliases":["responsibilities","what is your role","role responsibilities","day to day","architect responsibilities","what are your responsibilities","your role","what do you own","role and responsibilities","impact","how do you frame impact","your impact","what impact do you bring","what have you achieved","what changed because of you","what outcomes","business impact","value oriented"],"tags":["profile","core competencies","leadership"],"answer":"In my current Senior Architect role I own these responsibilities — the full scope, stated plainly.\\n\\nOn the record: \\"Drive frontend architecture and modernization initiatives across enterprise engagements, translating business requirements into scalable technical solutions while guiding engineering teams toward maintainable, performant applications.\\" Where measurable results exist I quote them; where they don't, I describe the technical improvement precisely rather than invent a metric — that's how I frame impact.","table":[{"term":"Define & drive","value":"Define and drive software architecture — scalable, modular, secure, high-performance systems, through end-to-end deployment."},{"term":"Foundation code","value":"Write the code everyone builds on — shared foundations, patterns and reference implementations teams extend rather than re-invent. Upgrade the stack without breaking it."},{"term":"APIs & integration","value":"Design scalable REST and GraphQL APIs; guide React/Next.js integration from demos to production."},{"term":"Design records","value":"Create and maintain HLDs, LLDs and architecture documentation that records why decisions were made — accurate, comprehensive and current."},{"term":"Reviews & quality","value":"Lead design discussions, architecture reviews and code-quality assessments; review the critical pull requests; evaluate architectural risk and build the mitigation."},{"term":"Signals & adoption","value":"Track RFCs and release notes; architect agentic frameworks — planning, tools, memory, orchestration — and drive adoption of GenAI, LLMs, RAG pipelines, embeddings and vector databases where they earn their place."},{"term":"Business alignment","value":"Explain the same design to executives, product and engineering stakeholders; collaborate with Product Management, R&D, QA and UX as senior technical advisor to strategic enterprise customers; partner with platform, sales and leadership to influence the roadmap, technology strategy and long-term platform evolution."},{"term":"Trade-offs","value":"Balance business objectives against technical debt; make the trade-offs that consider long-term impact; handle conflicting stakeholders, negotiate scope and deadlines — and defend choices with data."},{"term":"Cloud & operations","value":"Oversee deployments on AWS, Azure and GCP; support DevOps adoption, CI/CD and engineering automation; drive performance optimization, scalability and reliability initiatives."},{"term":"Enablement","value":"Mentor developers and technical leads; guide teams on design principles, coding standards and best practices; ensure compliance with quality, regulatory and healthcare software standards."}],"followups":["Competencies","AI engineering","Current work"],"related":["current-persistent","capabilities","ai-toolset","soft-skills"]},{"id":"current-persistent","summary":"Senior Architect at Persistent Systems, consolidating a portfolio of legacy products into one umbrella solution for one of the largest US healthcare payers — without pausing the business.","role":"Senior Architect","org":"Persistent Systems — Health & Life Sciences","period":"Nov 2021 – Present","title":"Senior Architect, HLS — Large-Scale Platform Consolidation","aliases":["current engagements","current undertaking","current role","what are you doing now","what is he doing now","current job","healthcare payer","top payer","hls","health life sciences","umbrella solution","what's going on with your client","what is he working on","what is he working on right now","working on right now","currently working on","current work","present role","latest role","these days","nowadays","what are you working on","what are you working on right now"],"tags":["employment","role-responsibilities","open to work"],"answer":"My current role as a Senior Architect with Persistent Systems being engaged with one of the largest healthcare payers and providers in the US, in the Health & Life Sciences space. I drive frontend architecture and modernization across the engagement — consolidating a set of legacy products under one umbrella solution while upgrading the services behind them, and guiding the team through the technical decisions that come with it. The work is consulting, solutioning and team supervision, with my hands still in the code when the architecture needs proving.","pitch":"I help teams modernize legacy applications without stopping the business — turning a portfolio of products into one maintainable solution, while the engineering team stays fast and the architecture stays honest.","followups":["AI engineering","Modernization","Leadership"],"related":["current-modernization","emp-persistent","open-to-work","ai-toolset","selected-evidence"]},{"id":"current-modernization","title":"Legacy Modernization, AI-Assisted","aliases":["legacy","migration strategy","strangler","how do you modernize","modernise","legacy apps","consolidation","react migration","modernization approach"],"tags":["recent work","AI-assisted engineering"],"answer":"A running theme of my recent work: legacy modernization. On the current healthcare-payer engagement I am consolidating legacy applications into a unified solution; earlier at a US health-insurance platform I ran a PoC proving a legacy app's UI could be converted to React incrementally without disrupting the existing system. Today, AI-assisted tooling — GitHub Copilot in customer work — accelerates code comprehension, refactoring and test scaffolding, with human review as the quality gate.","followups":["Modernization","AI engineering","Projects"],"related":["current-persistent","emp-payer-genetics","ai-toolset"]},{"id":"open-to-work","title":"Open to Work — Technical Leadership & Enablement","aliases":["why are you leaving","why are you looking","why leave","are you looking for a job","job seeking","what are you looking for","next step","whats next","what's next","are you available","career plan","what kind of job","what kind of position","what kind of company","looking for a change","moving on","availability"],"tags":["leadership"],"answer":"I’m exploring my next opportunity for a hands-on technology leadership role where I can position myself as a AI native Architect bridging businesses, product and engineering. With over two decades of experience spanning software development, frontend engineering, technical leadership, solution architecture, enterprise modernization and presales engagements, I want to continue translating complex business and technical requirements into scalable, maintainable digital solutions while remaining closely involved in implementation rather than operating solely at the architectural level.\\n\\nAn important consideration for my next role is the opportunity to work with greater autonomy, trust and empowerment — an environment where I can take ownership, make meaningful technical and execution decisions, bring the right people together, and drive initiatives from idea to outcome. I thrive where there is room to challenge conventional approaches, experiment, solve problems pragmatically and contribute beyond narrowly defined responsibilities.\\n\\nThe work I do today is what I want to pursue further alongside embedding customer teams, bridging business needs with product and engineering, co-building solutions using AI agent harnesses, and establishing the architecture, guardrails and enablement that help teams deliver and evolve solutions independently. For me, the value is not just in delivering code, but in creating the foundations, capabilities and engineering practices that enable lasting outcomes.","pitch":"Over 2 decades of experience spanning software development, frontend engineering, technical leadership, solution architecture, enterprise modernization and presales engagements — bridging business, product and engineering teams while remaining hands-on.","followups":["Open to work","Leadership","Career path"],"related":["current-persistent","soft-skills","ai-toolset","chapter-5-architect"]}]},"selectedWork":{"label":"Selected Work","entries":[{"id":"selected-evidence","title":"Recent Undertakings","aliases":["selected projects","which projects show his work","recent projects","show me his work","evidence","what projects best show","highlighted projects","project evidence","tell me about a project","which projects show your work","show me your work","what healthcare work have you done","how do you improve a codebase"],"tags":["projects"],"answer":"Four areas carry the weight of the recent work:","followups":["Projects","Modernization","Competencies"],"related":["chapter-5-architect","emp-payer-genetics","current-persistent","role-responsibilities"],"table":[{"term":"Healthcare & life sciences modernization","value":"Complex domain requirements against existing-application constraints and modern interfaces — the US health-insurance React modernization and UI architecture work for a global scientific-instruments maker."},{"term":"Architecture & product engineering","value":"Architectural decisions made against real scalability constraints — the genetic-testing platform built for very large data volumes."},{"term":"AI-assisted solutioning","value":"Winning the 2025 claims-recommendation proposal from my first PoC to a won proposal; AI engineering meeting a real business case; Most Valuable Player in Architect category, 2025."},{"term":"Engineering excellence & delivery","value":"Guardrails, improved technical stories, workflow documentation and developer-experience work — the unglamorous layer that makes a team faster and a codebase safer to change."}]},{"id":"selected-instruments","title":"Cloud Onboarding — Remote Visualization for Lab Users","aliases":["cloud onboarding","cloud onboarding engagement","remote visualization","remote visualisation","chromatography","data chromatography","scientific instruments engagement","instrument data","lab software","chromatography software","cloud onboarding architecture"],"tags":["projects","industry domains"],"summary":"Evaluated the cloud onboarding and remote-visualization architecture for a chromatography data system used in scientific laboratories.","challenge":"Instrument data was tied to the bench: results were visible on the instrument itself, but lab users working elsewhere could not see them.","contribution":"I assessed how the software could be onboarded to a cloud environment and what a remote-visualization architecture would need to do for lab users.","approach":"I kept the onboarding of the instrument software separate from the movement of the instrument's own processing or control functions — onboarding the application to the cloud does not move the instrument's control loop — and defined the boundary between them before expressing the result as a technical proposal.","outcome":"A defensible technical position for the client and their engineers: what could move to the cloud, what had to stay, and what the integration boundary looked like.","detail":"The integration boundaries between the instrument software and the cloud-based experience, the principal technical and operational constraints, and how remote visualization was structured for lab users., along with the cloud-integration fabric those constraints sit in — NATS messaging, Nomad scheduling and the Docker-based deployment pipeline.","answer":"One of the clearer pieces of current work in the scientific-instruments space is a cloud-onboarding engagement for a chromatography data system. The objective was to onboard the software to a cloud environment so that instrument data could be visualised remotely, for users who are not standing at the instrument. My contribution sits in the architecture-evaluation and solutioning side of it: working out what the remote-visualization architecture has to look like for lab users, what the constraints on instrument data are, and turning that into a technical proposal the customer and their engineers could actually act on. The engagement also gave me hands-on association with the cloud-integration fabric — NATS messaging and Nomad scheduling on the cloud side — with the deployment baseline built on Docker and CI/CD pipelines. It is a good example of the presales half of this role — an unfamiliar domain, real constraints on how the data is held, and an answer that has to satisfy both the business and the engineers who would run it.","evidence":["My specific responsibility in the technical evaluation.","How the remote-visualization workflow operated in practice.","The principal constraints that shaped the proposal."],"followups":["Domains","Cloud onboarding","Projects"],"tools":"React · graphql · golang · NATS · Nomad · Docker · Azure · cloud onboarding evaluation · remote-visualization architecture · chromatography data system assessment"},{"id":"selected-healthcare","title":"Healthcare & Life Sciences Modernization","aliases":["healthcare modernization","scientific instruments project","life sciences projects","what healthcare work has he done","react proof of concept","health insurance application","insurance application modernization"],"tags":["projects","industry domains"],"summary":"Defined the frontend modernization approach for a legacy health-insurance application, validating an incremental React conversion through a proof of concept.","challenge":"The application needed modernizing, but its business functionality had to stay available throughout.","contribution":"I led the frontend modernization approach and validated the incremental React conversion through a proof of concept.","approach":"The proof of concept fixed the migration boundary — which parts of the interface could move to React while the rest of the application kept running — and tested that a slice could be converted without disrupting the live system.","outcome":"It demonstrated that the application could be modernized incrementally rather than all at once, which is what makes modernization a decision a business can actually take.","detail":"Migration boundaries and coexistence with the existing functionality, the component strategy for the converted slice, and how the conversion was validated.","answer":"Healthcare and life sciences are where I have pushed modernization hardest. At a US health-insurance platform I led hands-on React modernization of a legacy insurance application, validated through an incremental-conversion proof of concept that showed a slice could be converted without disrupting the running system. Alongside that, I have done UI architecture evaluation for a global scientific-instruments manufacturer — data chromatography and analytical systems where the interface has to make dense, instrument-driven workflows usable — most concretely the chromatography cloud-onboarding engagement for remote visualization. The common thread is working inside real constraints — an estate that cannot be paused — and moving it forward in slices that keep the business running.","evidence":["The scope of the proof of concept — which screens or workflows it covered.","Whether the approach informed a subsequent implementation decision.","Any measured performance or maintainability improvement."],"followups":["Domains","Healthcare modernization","Modernization"],"tools":"React · Nextjs · RTKQ · Springboot · RestAPI · AWS · incremental-conversion PoC · splunk · launch-darkly"},{"id":"selected-architecture","title":"Architecture at Scale — Genetic-Testing Platform","aliases":["genetic platform","genetics platform","petabyte scale","scalability","data volumes","scientific analysis pipelines","genetics architecture"],"tags":["projects"],"summary":"Defined the frontend architecture for a genetic-testing platform processing very large volumes of scientific and diagnostic data.","challenge":"A standardized genetic platform had to serve both diagnostics and research workflows, with data volumes well beyond a conventional web application.","contribution":"I defined the frontend architecture for the platform, and how complex scientific workflows were represented in the interface.","approach":"The architecture separated presentation from the volume of the underlying data — deciding which data the frontend actually needed, and rendering that rather than the full dataset — so the interface stayed responsive while the platform's overall data scale kept growing.","outcome":"A reusable frontend architecture that could absorb new tests, new workflows and new laboratories without rework.","detail":"How complex scientific workflows were represented in the UI, the split of responsibility between frontend and backend, the trade-offs between performance, usability and maintainability, and how the architecture accommodated additional tests and laboratories.","answer":"At a US genetics-testing company I defined the frontend architecture for a standardized genetic platform handling very large data volumes, with scientific analysis pipelines feeding diagnostics and research use. The work was about making an architecture that holds up when the data is enormous and the workflows are scientific rather than commercial: standardising how analyses are presented, keeping the interface usable against dense data, and making sure the platform could scale to new tests and new labs without rework. It is the clearest example of architecture decisions made against real scalability constraints rather than abstract ones.","evidence":["The volume of data actually rendered in the browser, as distinct from the platform's overall data scale.","How new tests, workflows or laboratories were absorbed.","Any measured performance outcome."],"followups":["Projects","Genetics platform","Tech stack"],"tools":"Nextjs · Redux · RestAPI · Java-Springboot · AWS · Volume-aware frontend architecture · presentation–data separation · scalable interface design"},{"id":"selected-engineering","title":"Engineering Excellence & Delivery","aliases":["guardrails","technical stories","engineering standards","workflow documentation","cases development module","engineering practices","how does he improve a codebase","code quality"],"tags":["projects","leadership"],"answer":"Alongside architecture, I spend time on the work that makes delivery sustainable: establishing guardrails so teams can move faster without a review bottleneck, writing better technical stories so estimates and acceptance criteria stop drifting, documenting application workflows so the knowledge survives the people who built it, and rebuilding the cases development module to make a core workflow tractable again. None of it is glamorous work; all of it is what separates a codebase that ages well from one that doesn't.","followups":["Projects","Leadership","Competencies"],"related":["soft-skills","core-stack","chapter-5-architect","selected-evidence"]},{"id":"selected-hrp-claims","title":"AI-Assisted Claims Recommendation — Proposal & PoC for an Healthcare Resource Platform","aliases":["hrp claims","hrp plugin","ai claims recommendation","claims recommendation","claims recommender","hrp proposal","claims plugin","ai assisted claims","hrp claims recommendation","claims recommendation plugin","eligibility recommendation","claims decision ai"],"tags":["projects","AI-assisted engineering"],"summary":"Solutioned and won a 2025 proposal for an AI-assisted claims-recommendation plugin for an Healthcare Resource Platform — a rules + ML hybrid that recommends eligibility decisions on employee claims, with a demonstrated proof of concept.","challenge":"Claims adjucation on an HRP platform — reimbursements, benefits, insurance — were reviewed manually against plan rules that vary by policy, geography and dependent status. The client wanted faster, more consistent decisions without losing governance: no black-box approvals, no silent rule drift. The proposal had to show an AI approach the business could defend.","contribution":"I led the proof of concept end to end and shaped the solution story: how the recommendation engine splits responsibility between deterministic rules and learned patterns, what the reviewer sees for each recommendation, how the plugin embeds in the existing HRP interface, and what it means operationally. I prepared the architecture diagrams for the proposal, and collaborated with the domain team on entitlement logic and with the sales team on how the case gets heard in the room.","approach":"The heart of the design is a deliberate split: a deterministic eligibility engine owns the hard constraints — plan rules, policy limits, dependent entitlements — and an ML recommendation layer sits on top for the judgement calls, learning from historical outcomes. Every recommendation arrives with its grounds — the rule that fired or the pattern that matched — so a reviewer can trust, correct and audit it. The PoC ran the recommendation flow inside the actual claims journey of the HRP UI, as a plugin rather than a separate portal.","outcome":"The proposal was won. The client's claims process now moves from manual review toward an explainable, AI-assisted decision flow — and the work was recognized with the Most Valuable Player award in the Architect category, 2025.","detail":"How the rules engine and the ML layer split each decision, the explainability and audit story for reviewers, how the plugin embeds into the existing HRP interface, and how the PoC demonstrated the recommendation flow to the client.","answer":"The proposal work I am proudest of from 2025: an AI-assisted claims recommendation plugin for an HR platform. Employees submit claims — reimbursements, benefits, insurance — and the plugin recommends the decision: what proportion is payable, which rules apply, what needs a reviewer's eye, with the reasoning attached. The solution is deliberately a hybrid — a deterministic eligibility engine enforces the hard plan rules, and an ML layer learns from historical outcomes to handle the judgement calls — so recommendations stay explainable and auditable rather than black-box. I led the proof of concept, prepared the architecture diagrams for the proposal, and collaborated with the domain and sales teams to carry the case. The proposal was won, and the work was recognized with the Most Valuable Player award in the Architect category, 2025. It is the clearest example of what I keep finding myself saying about AI in engineering: it earns its place only inside structure — clear rules, disciplined process, honest review.","evidence":["How each decision is split between the deterministic eligibility engine and the ML layer.","The explainability shown for a recommendation — which rule fired or which pattern matched.","How the PoC embedded in the HRP claims journey as a plugin.","The link between this work and the Most Valuable Player award, 2025."],"followups":["AI engineering","Certifications & awards","Competencies"],"related":["selected-evidence","role-responsibilities","current-persistent"],"tools":"Deterministic rules engine · ML recommendation layer · explainable recommendation flow · HRP UI plugin PoC"}]},"employmentHistory":{"label":"Employment History","entries":[{"id":"employment-history","title":"Employment History at a Glance","aliases":["employment history","work history","career history","his employment","where has he worked","job history","employers","all roles","roles and companies","your employment","where have you worked"],"tags":["employment"],"answer":"The whole employment arc at a glance — one row per phase. Across them: in-house product teams, remote freelance contracting, and embedding with customer teams as an enabler.","followups":["Employment","Career path","Current work","consulting"],"related":["chapter-1-foundation","chapter-5-architect","current-persistent","emp-ea ad across healthcare and genetics platforms — React modernization of a legacy insurance application, and frontend architecture for a genetic-testing platform handling very large data volumes.","role":"Architect / Lead, Frontend","org":"US health-insurance platform · US genetics-testing company","period":"Dec 2021 – Nov 2022","title":"Healthcare & Genetics Platforms — Architect Roles (2021–2022)","aliases":["genetics","2021 2022","iiflw","bsfi","digital transformation proposal","payer platform","insurance platform"],"tags":["employment"],"answer":"At a US health-insurance platform (Jun–Nov 2022) I led hands-on React modernization of a legacy insurance application, validated through an incremental-conversion PoC. At a US genetics-testing company (Dec 2021–Jun 2022) I defined the frontend architecture for a standardized genetic platform supporting petabyte-scale data with scientific analysis pipelines for diagnostics and research. I also shaped an RFP for a digital-transformation proposal for a banking, financial services and insurance customer.","followups":["Projects","Healthcare modernization","Genetics platform"],"related":["emp-persistent","domain-healthcare","current-modernization"]},{"id":"emp-wizard-conscience","summary":"Led frontend teams delivering custom e-commerce, healthcare and e-learning products, moving from implementation into UI architecture, technology evaluation and solution design.","role":"Team Lead UI/UX · Senior Technical Consultant","org":"Conscience IT · Wizard Communication","period":"Feb 2017 – Jul 2021","title":"Wizard Communication & Conscience IT (2017–2021)","aliases":["conscience","ecommerce","elearning lead","2017 2021","adapt framework"],"tags":["employment","leadership","career"],"answer":"At Wizard Communication (2019–2021) I led frontend teams building custom e-commerce and healthcare products, with exposure to Industry 4.0 solutions. At Conscience IT (2017–2019) I led UI/UX delivery for bespoke products and e-learning services — building third-party plugins for the Adapt framework, simulation-based learning ware for a leading enterprise learning platform, Moodle and Blackboard LMS work, plus apps for desktop and low-end Raspberry Pi devices.","followups":["Employment","Leadership","Tech stack"],"related":["domain-others","emp-freelance","soft-skills"]},{"id":"emp-freelance","summary":"Five years as a remote contractor and freelancer for international customers — prime work in e-learning courseware development and converting Flash-based legacy products to their newer technology counterparts, across six industries.","role":"Consultant / Technical Advisor","org":"Independent Consulting (Freelance)","period":"2012 – 2017","title":"Independent Consulting & Freelance (2012–2017)","aliases":["freelance","consultant","consulting","clients","2012 2017","independent contractor","advisor","e-learning courseware"],"tags":["employment","modernization"],"answer":"For five years I worked as a remote freelancer and individual contractor for international customers across media and entertainment, banking, academic publishing, workforce software, insurance brokerage and market research — engagements ran through global freelance marketplaces as well as direct contracts. The prime work involved e-learning courseware development, a natural continuation of my early craft, and converting Flash-based legacy products to their newer technology counterparts as the Flash era ended. The conversion engagements meant reading someone else's product closely, mapping its behaviour and business purpose, and rebuilding it on the newer stack without breaking what its users depended on — independently, without a team to fall back on.","followups":["Employment","Modernization","Domains"],"related":["emp-wizard-conscience","domain-others","current-modernization"]},{"id":"emp-early-career","summary":"The first decade in multimedia and e-learning — interactive 3D presentations, CD-ROM applications, an e-learning automation product, simulations and learning platforms, across six employers.","role":"Multimedia Programmer → Technology Manager","org":"Integrated Research · Aesthetic Technologies · Brainvisa (Encora) · Digital Domain · NIIT · Aptara","period":"Nov 2002 – Sep 2012","title":"Early Career — Multimedia & E-Learning (2002–2012)","aliases":["early career","e-learning history","multimedia","beginnings","first job","flash","3d interactivities"],"tags":["employment","career"],"answer":"The first decade was spent making software that taught people: interactive 3D presentations, CD-ROM applications and rich-media websites for national and international clients, then product engineering at Brainvisa Technologies (now Encora), Digital Domain India, NIIT and Aptara — an e-learning automation product that turned Word content into courseware, interactive simulations and game-based learning applications, a desktop media-center product, and the technical and business-development support behind e-learning engagements, including an in-house training academy for a global audit-and-advisory firm.","followups":["Employment","Projects","Education"],"related":["domain-others","education","interests"]}]},"softSkillsToolsets":{"label":"Soft Skills & Toolsets","entries":[{"id":"ai-toolset","title":"AI Toolset & Agent Workflows","aliases":["ai","ai tools","copilot","github copilot","cline","opencode","ollama","llm","rag","mcp","agents","react agents","evals","amazon q","hermes","openclaw","tailscale","prompt engineering","context engineering","agent harness","harness","adlc","llama","mistral","phi","embedding models","local models","ai first","ai-first","AI engineering","how do you lead a team"],"tags":["AI-assisted engineering"],"answer":"The AI tooling I work with day to day — models, harnesses and the practice around them: The working model: development work is handed to the agents — they do the coding while I control the setup, the plumbing and the review.","followups":["AI engineering","Tech stack","Comp
