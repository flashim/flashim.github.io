        var theme = null;
        try {
          theme = localStorage.getItem('resume-theme');
        } catch (e) {
          /* storage blocked — fall through to the OS preference */
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        /* slider position: 0 = dark (top) · 1 = light (bottom) */
        root.style.setProperty('--pos', theme === 'dark' ? '0' : '1');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', theme === 'dark' ? '#0c0c0e' : '#ffffff');
        }
      })();
    </script>

"core competencies",label:"Competencies",route:"capabilities",starter:!1},{id:"tech stack",label:"Tech stack",route:"core-stack",starter:!0},{id:"AI-assisted engineering",label:"AI engineering",route:"ai-toolset",starter:!1},{id:"leadership",label:"Leadership",route:"soft-skills",starter:!1},{id:"industry domains",label:"Domains",route:"domain-healthcare",starter:!1},{id:"education",label:"Education",route:"education",starter:!1},{id:"interests",label:"Interests",route:"interests",starter:!1},{id:"open to work",label:"Open to work",route:"open-to-work",starter:!1},{id:"certifications",label:"Certifications & awards",route:"certifications",starter:!1}],questions:[{label:"Introduction",route:"positioning"},{label:"90-second introduction",route:"self-introduction"},{label:"Modernization pitch",route:"positioning"},{label:"Leadership pitch",route:"positioning"},{label:"Client-facing pitch",route:"positioning"},{label:"Healthcare modernization",route:"selected-healthcare"},{label:"Genetics platform",route:"selected-architecture"},{label:"Cloud onboarding",route:"selected-instruments"},{label:"How did I start my career?",route:"chapter-1-foundation"},{label:"AI claims recommendation",route:"selected-hrp-claims"}]},$n=[{from:"2002-11",to:"2005-09",stage:"Multimedia Programmer",label:"interactive digital experiences",chapter:"chapter-1-foundation"},{from:"2005-11",to:"2009-01",stage:"Technology Management / Product Development",label:"reusable products and platforms",chapter:"chapter-2-product"},{from:"2009-01",to:"2012-09",stage:"Technology Management / Program Design",label:"product development and delivery",chapter:"chapter-2-product"},{from:"2012-01",to:"2017-04",stage:"Consultant / Technical Advisor",label:"modernization and independent solutioning",chapter:"chapter-3-transformation"},{from:"2017-02",to:"2021-07",stage:"Team Lead / Technical Consultant / Architect",label:"frontend specialization and leadership",chapter:"chapter-4-specialization"},{from:"2021-11",to:null,stage:"Senior Architect, Persistent",label:"enterprise architecture and modernization",chapter:"chapter-5-architect"}],Nn={intro:"Five short stages, about five minutes. Skip it at any point — the question-answering experience is always there.",stages:[{id:"who-i-am",label:"Who I am",heading:"A hands-on technology architect, {{experience}} in.",body:"I am a Senior Technology Architect with {{experience}} across software development, frontend engineering, technical leadership, solution architecture, enterprise modernization and presales. I sit between business, product and engineering: I turn ambiguous requirements into outcomes, and I stay close enough to the code to know whether an architecture actually holds. The work ranges wider than frontend: an architecture has to hold across the user experience, the frontend structure, the API contracts and backend integration behind it, the cloud infrastructure it lands on, and the performance people actually feel. Trained in design, I read an interface with the same care I give an architecture.",action:{label:"How I got here",target:"next"}},{id:"how-i-evolved",label:"How I evolved",heading:"Five chapters, one continuous craft.",body:"2002–2005 multimedia programming and interactive experiences, which taught me to combine programming with user experience. 2005–2012 product engineering and e-learning platforms — plugins and extensions among them — which taught me the whole delivery lifecycle. 2012–2017 independent consulting and legacy modernization across various industries. 2017–2021 frontend engineering, UI/UX and technical leadership. From November 2021, enterprise modernization and business-aligned architecture as a Senior Architect.",action:{label:"See the career narrative",target:"career"}},{id:"what-i-delivered",label:"What I delivered",heading:"Three pieces of work worth your attention.",body:"A React modernization proof of concept on a legacy health-insurance application, which proved a slice could move without pausing the business. A cloud-onboarding and remote-visualization evaluation for a chromatography data system in scientific labs. And the frontend architecture for a genetic-testing platform, which had to make very large data volumes something a scientist could actually work with. Behind all three sits one habit: asking not only whether a solution works today, but whether it stays maintainable, performant and useful to the business over time.",action:{label:"Explore a project",target:"projects"}},{id:"how-i-work",label:"How I work",heading:"Architectural thinking, with hands-on engineering.",body:"I establish the approach, set the guardrails, work the trade-offs with the team, and stay in the implementation when the design needs proving. Design is a working tool for me, not decoration: my foundation in UX and human–computer interaction means requirements turn into flows and system sketches before they turn into code, design thinking shapes how I approach them, and accessibility is part of the same craft — from semantic structure to a working command of the ARIA standards that make an interface genuinely usable. With clients I work the same way — embedding, shaping requirements against real constraints, and leaving behind something the team can sustain rather than a document nobody opens.",action:{label:"Ask about leadership",target:"ask",query:"Leadership"}},{id:"where-heading",label:"Where I am heading",heading:"A hands-on technology leadership role, with AI-assisted delivery.",body:"I am open to work and evaluating opportunities. I am looking for a role where I can act as an enabler for the team and the customer — owning end-to-end solutioning, and using AI agent harnesses as a force multiplier without giving up the human review that keeps quality honest. The habit I bring to a team is the same one I keep at home: small plugins I build for the tools I use day to day, and weekend experiments with Linux on a Raspberry Pi — a low-stakes place to meet the technology the work often adopts later. If that sounds like the kind of team you are building, I would like to hear from you.",action:{label:"Reach out",target:"contact"}}]},Hn={match:["hi","hii","hey","hiya","yo","howdy","namaste","hello","greetings","good morning","good afternoon","good evening","hey there","hi there","hello there","how are you","hows it going","how is it going","how have you been","nice to meet you","good to see you","anything new"],answer:"Hi — I'm Ashim. A Senior Technology Architect with {{experience}} of experience across software engineering, frontend architecture, enterprise modernization and technical leadership. I combine architectural thinking with hands-on engineering to bridge business, product and engineering teams — and to deliver scalable, maintainable solutions. Ask me about my career, my stack, my domains, or how I pitch myself.",followups:["Introduction","Current work","Career path"]},Un=[{id:"compensation",title:"Compensation",match:["salary","salaries","ctc","compensation","remuneration","pay","pay package","package","pay scale","how much does he earn","how much do you earn","what is his salary","what is your salary","expected salary","current salary","salary expectation","salary expectations","lpa","per annum","per month pay","bonus","perks","pay slip","increment","raise","hike"],answer:"I can't share compensation details — that's confidential on both sides of any offer, and it isn't something I put in an interactive resume. Reach me directly on email or phone and I'll take it from there.",followups:["Open to work","Current work"]},{id:"client-confidentiality",title:"Client Confidentiality",match:["which client","who was the client","who is the client","client name","customer name","who is the customer","name of the client","which company did he work for","which company did you work for","which payer","which healthcare company","which startup","nda","under nda","non disclosure","is it confidential"],answer:"Client names aren't mine to share — Persistent's policy is not to reveal customer identities. I can go into as much detail as you like on the scope, the domain, the stack and the outcomes, without naming anyone.",followups:["Current work","Projects"]}],Vn=JSON.parse(`{"about":{"label":"About","entries":[{"id":"about-me","title":"About me","aliases":["explore career path","about me","who are you","who is ashim","tell me about yourself","introduce","yourself","overview","summary","which one are you","what have you been up to","background","bio","walk me through your career","walk me through his career","tell me about his career","career path","career journey","career so far","give me a rundown","tell me about your career"],"tags":["profile","career"],"answer":"I am Ashim Saha — a Senior Technology Architect. I spent {{experience}} turning legacy enterprise estates into modern, maintainable systems, and I am the kind of architect who stays close to the code: I shape the solution and I still review and write alongside the teams who build it. Right now I am open to a change — the details are one question away.","pitch":"I am a hands-on technology architect who evolved from building interactive digital experiences to designing and modernizing complex enterprise applications.","followups":["Introduction","Career path","Current work"],"related":["chapter-5-architect","current-persistent","ai-toolset","open-to-work"]}]},"positioning":{"label":"Positioning","entries":[{"id":"positioning","title":"Introduction","aliases":["introduction","how would he pitch himself","how does he describe himself","positioning","elevator pitch","pitch","introduce him in one line","one line summary","how should i describe him","professional summary","profile line","value proposition","what is his professional identity","the pitch","default pitch","primary pitch","how does he introduce himself professionally","modernization pitch","pitch for a modernization role","digital transformation pitch","application modernization pitch","legacy modernization pitch","how would he pitch himself for a modernization role","leadership pitch","pitch for an engineering leadership role","principal engineer pitch","technical leadership pitch","engineering leader pitch","how would he pitch himself for a leadership role","business facing pitch","presales pitch","client facing pitch","advisory pitch","solution consulting pitch","how would he pitch himself for a client-facing role","how do you pitch yourself","how do you describe yourself","introduce yourself in one line","how should i describe you","what is your professional identity","how do you introduce yourself professionally","your pitch"],"tags":["profile"],"answer":"When a first conversation starts, here is how I introduce myself: I'm an architect who has spent 23+ years turning modernization ambitions into running systems. In that time I've learned to sort the problem: choosing the right technology is the easy half; the hard half is the structure around it — discipline, process, honest planning, and the right resources engaged at the right time. That's where I put my attention first, and a hands-on engineering foundation is what keeps the plan honest. The same pitch flexes by room — a modernization emphasis for transformation rooms, a leadership emphasis for principal-level rooms, a business-facing emphasis for presales rooms; name the room and the emphasis shifts.","followups":["Employment","Competencies","Current work"],"related":["about-me","open-to-work","chapter-5-architect","capabilities"]},{"id":"capabilities","title":"Core Competencies","aliases":["what are his core competencies","capabilities","what is he good at","key skills","areas of expertise","strengths","what does he bring","competency areas","what are his strengths"],"tags":["core competencies"],"answer":"I lead with: solution and frontend architecture; enterprise application modernization; React and modern web technologies; UI/UX and application usability; architecture standards and engineering best practices; technical leadership and stakeholder management; presales, RFPs and proofs of concept; and performance, maintainability and quality engineering. Behind the headline sits the way I think — design thinking and a solid grounding in human–computer interaction, a systems-design reading of how the pieces around an interface connect, and a long-standing interest in performance: analysing bottlenecks and recommending the practices and solutions whose value keeps compounding for the team long term. Underneath those sits the depth — {{experience}} of frontend engineering, modernization of legacy estates, and hands-on delivery across healthcare, life sciences, BFSI, e-learning, e-commerce and gaming.","followups":["Tech stack","Leadership","Projects"],"related":["positioning","core-stack","soft-skills","selected-evidence"]},{"id":"impact","title":"How I Frame Impact","aliases":["how does he describe his impact","what results does he bring","business impact","value he brings","how does he frame his work","what has he achieved","value oriented","what changed because of him","what outcomes"],"tags":["core competencies"],"answer":"I frame work as outcomes rather than duties: \\"Drive frontend architecture and modernization initiatives across enterprise engagements, translating business requirements into scalable technical solutions while guiding engineering teams toward maintainable, performant applications.\\" Where measurable results exist I use them; where they don't, I describe the technical improvement precisely rather than inventing a metric. The themes that recur: modernizing legacy estates without pausing the business, frontend standards and reusable practices that outlive the project, and presales support through evaluations, proofs of concept and architecture proposals.","followups":["Projects","Modernization","Leadership"],"related":["chapter-5-architect","selected-evidence","soft-skills"]}]},"professionalStory":{"label":"The Career Story","entries":[{"id":"chapter-1-foundation","title":"The Foundation — Building Interactive Digital Experiences (2002–2005)","theme":"The foundation — building interactive digital experiences","aliases":["chapter 1","how did he start","how did he begin his career","start of his career","early years","multimedia programming","cd-rom","3d presentations","interactive experiences","foundation","2002 to 2005","first five years","how did he begin"],"tags":["career"],"answer":"2002–2005 | Multimedia programming and interactive applications. My career began with multimedia programming — interactive 3D presentations, CD-ROM applications and rich-media websites for national and international clients. I developed interactive and multimedia applications, created educational content and rich-media experiences, and combined visual design concepts with programming, building a foundation in user interaction and digital experiences. I started at the intersection of technology and visual communication, which gave me an early appreciation for how software should behave from the user's perspective, not just how it should work technically.","pitch":"My career began with interactive multimedia applications, where I learned to combine programming with user experience. That foundation shaped my approach to software engineering: technology should solve a problem while making the experience intuitive for the user.","followups":["Employment","Projects","Education"],"related":["chapter-2-product","emp-early-career","education"]},{"id":"chapter-2-product","title":"The Product Mindset — From Development to Technical Leadership (2005–2012)","theme":"The product mindset — from development to technical leadership","aliases":["chapter 2","product mindset","product engineering","2005 to 2012","brainvisa","encora","digital domain","niit","aptara","rapidel","e-learning product","media center","from development to leadership"],"tags":["career"],"answer":"2005–2012 | Product engineering, e-learning platforms and team leadership. At Brainvisa Technologies (now Encora), Digital Domain India, NIIT and Aptara my work expanded from building individual experiences into product engineering. I contributed to RapideL, an e-learning automation product that fed Word content into Flash courseware; built interactive simulations and game-based learning applications; developed the Media-Center desktop product; and supported technical solutions and business development for e-learning engagements, including an in-house training academy for a global audit-and-advisory firm. My responsibilities extended beyond implementation into technical management, solution development, quality reviews and collaboration with business stakeholders.","pitch":"As I progressed, I moved from building individual applications to working on products and reusable platforms. That taught me the complete development lifecycle — technical design, quality, team collaboration, and delivering solutions that meet business needs.","followups":["Employment","Projects","Leadership"],"related":["chapter-1-foundation","chapter-3-transformation","emp-early-career"]},{"id":"chapter-3-transformation","title":"The Transformation — Legacy Modernization and Independent Solutioning (2012–2017)","theme":"The transformation — legacy modernization and independent solutioning","aliases":["chapter 3","transformation","consulting years","freelance years","independent years","2012 to 2017","flash modernization","legacy modernization story","individual contractor","modernization chapter"],"tags":["career","modernization"],"answer":"2012–2017 | Consulting, independent delivery and legacy modernization. Five years as an independent consultant and individual contractor, working with organizations across media and entertainment, banking, academic publishing, workforce software, insurance brokerage and market research — and modernizing multiple Flash-based legacy applications. I worked inside different client environments and business domains, adapting to varying technical requirements and constraints, and delivered both independently and collaboratively. This period bridged my multimedia background and the frontend architecture specialization that followed: I learned to assess existing systems, understand constraints, and evolve applications without losing sight of their purpose.","pitch":"My consulting years taught me to solve problems in diverse environments. The recurring theme was modernizing legacy applications — not simply replacing old technology, but preserving business functionality while improving the underlying user experience and technical implementation.","followups":["Employment","Modernization","Domains"],"related":["chapter-2-product","chapter-4-specialization","emp-freelance","current-modernization"]},{"id":"chapter-4-specialization","title":"The Specialization — Frontend Engineering, UX and Technical Leadership (2017–2021)","theme":"The specialization — frontend engineering, UX and technical leadership","aliases":["chapter 4","specialization","2017 to 2021","wizard communication","conscience it","e-commerce products","ui ux leadership","raspberry pi","moodle","blackboard","industry 4.0","frontend leadership"],"tags":["career","leadership"],"answer":"2017–2021 | Frontend engineering, UX and technical leadership. At Conscience IT and Wizard Communication I took on broader responsibilities — leading frontend developers, developing custom e-commerce and healthcare products, evaluating technologies and making implementation decisions, building e-learning plugins and simulations, working with Moodle and Blackboard, and supporting applications for desktop environments and resource-constrained devices such as Raspberry Pi. Frontend development became more than implementing screens: it involved selecting appropriate technologies, organizing development, evaluating trade-offs, and ensuring the solution met user and business requirements.","pitch":"Over time frontend engineering became my core specialization. I moved beyond implementation into UI architecture, technology evaluation, team leadership and solution design — increasingly focused on simplifying complex requirements and creating maintainable applications across platforms.","followups":["Employment","Leadership","Tech stack"],"related":["chapter-3-transformation","chapter-5-architect","emp-wizard-conscience","soft-skills"]},{"id":"chapter-5-architect","title":"The Architect — Enterprise Modernization and Business-Aligned Technology (Nov 2021–present)","theme":"The architect — enterprise modernization and business-aligned technology","aliases":["chapter 5","architect chapter","2021 to present","senior architect","persistent","enterprise modernization","business aligned technology","presales","rfp","architectural advisor","current chapter","recent chapter"],"tags":["career","recent work"],"answer":"November 2021 – present | Senior Architect, Persistent Systems. My current role brings together every strand of the career. The work spans healthcare and life sciences, BFSI, enterprise modernization, product development, UI migrations, presales evaluations and RFP-driven proposals. I design frontend solutions and establish engineering practices; move legacy applications toward modern interfaces and architectures; translate business and product requirements into technical approaches; connect business expectations with engineering decisions; and support teams through implementation and technical problem-solving. I act as an architectural advisor while contributing hands-on when necessary — through proofs of concept, technical evaluations and RFP responses.","pitch":"Today I operate at the intersection of architecture, engineering and business. I help teams modernize applications, make sound technology decisions, and translate complex requirements into practical solutions. My strength is combining architectural thinking with hands-on engineering and stakeholder collaboration to deliver maintainable, user-focused software.","followups":["Current work","Projects","Modernization"],"related":["chapter-4-specialization","current-persistent","emp-persistent","open-to-work"]}]},"currentUndertaking":{"label":"Current Undertaking","entries":[{"id":"current-persistent","summary":"Senior Architect at Persistent Systems, consolidating a portfolio of legacy products into one umbrella solution for one of the largest US healthcare payers — without pausing the business.","role":"Senior Architect","org":"Persistent Systems — Health & Life Sciences","period":"Jun 2023 – Present","title":"Senior Architect, HLS — Large-Scale Platform Consolidation","aliases":["current engagements","current undertaking","current role","what are you doing now","what is he doing now","current job","healthcare payer","top payer","hls","health life sciences","umbrella solution","what's going on with your client","what is he working on","what is he working on right now","working on right now","currently working on","current work","present role","latest role","these days","nowadays","what are you working on","what are you working on right now"],"tags":["recent work","employment"],"answer":"Since June 2023 I have been a Senior Architect with Persistent Systems, engaged with one of the largest healthcare payers and providers in the US, in the Health & Life Sciences space. I drive frontend architecture and modernization across the engagement — consolidating a set of legacy products under one umbrella solution while upgrading the services behind them, and guiding the team through the technical decisions that come with it. The work is consulting, solutioning and team supervision, with my hands still in the code when the architecture needs proving.","pitch":"I help teams modernize legacy applications without stopping the business — turning a portfolio of products into one maintainable solution, while the engineering team stays fast and the architecture stays honest.","followups":["AI engineering","Modernization","Leadership"],"related":["current-modernization","emp-persistent","open-to-work","ai-toolset","selected-evidence"]},{"id":"current-modernization","title":"Legacy Modernization, AI-Assisted","aliases":["legacy","migration strategy","strangler","how do you modernize","modernise","legacy apps","consolidation","react migration","modernization approach"],"tags":["recent work","modernization","AI-assisted engineering"],"answer":"A running theme of my recent work: legacy modernization. On the current healthcare-payer engagement I am consolidating legacy applications into a unified solution; earlier at a US health-insurance platform I ran a PoC proving a legacy app's UI could be converted to React incrementally without disrupting the existing system. Today, AI-assisted tooling — GitHub Copilot in customer work — accelerates code comprehension, refactoring and test scaffolding, with human review as the quality gate.","followups":["Modernization","AI engineering","Projects"],"related":["current-persistent","emp-payer-genetics","ai-toolset"]},{"id":"open-to-work","title":"Open to Work — Technical Leadership & Enablement","aliases":["why are you leaving","why are you looking","why leave","are you looking for a job","job seeking","what are you looking for","next step","whats next","what's next","are you available","career plan","what kind of job","what kind of position","what kind of company","looking for a change","moving on","availability"],"tags":["open to work","leadership"],"answer":"Yes — I am exploring a change, and I am looking for a hands-on technology leadership role where I can bridge business, product and engineering. I want work that turns complex requirements into scalable, maintainable digital solutions — and a team where I can still stay close to the implementation rather than operating only at the architectural level. The FDE-style work I do today — embedding with customer teams, co-building with AI agent harnesses, and leaving behind guardrails and enablement rather than just code — is exactly the shape of role I am aiming for.","pitch":"More than 20 years of experience spanning software development, frontend engineering, technical leadership, solution architecture, enterprise modernization and presales engagements — bridging business, product and engineering teams while remaining hands-on.","followups":["Open to work","Leadership","Career path"],"related":["current-persistent","soft-skills","ai-toolset","chapter-5-architect"]}]},"selectedWork":{"label":"Selected Work","entries":[{"id":"selected-evidence","title":"Where the Architect Work Shows Up","aliases":["selected projects","which projects show his work","recent projects","show me his work","evidence","what projects best show","highlighted projects","project evidence","tell me about a project","which projects show your work","show me your work","what healthcare work have you done","how do you improve a codebase"],"tags":["projects"],"answer":"Four areas carry the weight of the recent work. Healthcare and life-sciences modernization — including the React modernization at a US health-insurance platform and UI architecture work for a global scientific-instruments manufacturer — is how I handle complex domain requirements, existing-application constraints and modern interfaces together. Architecture and product engineering — most visibly the genetic-testing platform I architected for a US genetics company, built for very large data volumes — is where the architectural decisions and scalability considerations behind a real product live. AI-assisted solutioning — the winning 2025 proposal for an AI-assisted claims-recommendation plugin on an HR platform, taken from my first PoC to a won proposal — is where AI engineering met a real business case; it earned the Most Valuable Player award in the Architect category, 2025. Engineering excellence and delivery — establishing guardrails, improving technical stories, documenting application workflows and rebuilding the cases development module — is the unglamorous work that makes a team faster and a codebase safer to change.","followups":["Projects","Modernization","Competencies"],"related":["chapter-5-architect","emp-payer-genetics","current-persistent","impact"]},{"id":"selected-instruments","title":"Cloud Onboarding — Remote Visualization for Lab Users","aliases":["cloud onboarding","cloud onboarding engagement","remote visualization","remote visualisation","chromatography","data chromatography","scientific instruments engagement","instrument data","lab software","chromatography software","cloud onboarding architecture"],"tags":["projects","industry domains"],"summary":"Evaluated the cloud onboarding and remote-visualization architecture for a chromatography data system used in scientific laboratories.","challenge":"Instrument data was tied to the bench: results were visible on the instrument itself, but lab users working elsewhere could not see them.","contribution":"I assessed how the software could be onboarded to a cloud environment and what a remote-visualization architecture would need to do for lab users.","approach":"I kept the onboarding of the instrument software separate from the movement of the instrument's own processing or control functions — onboarding the application to the cloud does not move the instrument's control loop — and defined the boundary between them before expressing the result as a technical proposal.","outcome":"A defensible technical position for the client and their engineers: what could move to the cloud, what had to stay, and what the integration boundary looked like.","detail":"The integration boundaries between the instrument software and the cloud-based experience, the principal technical and operational constraints, and how remote visualization was structured for lab users., along with the cloud-integration fabric those constraints sit in — NATS messaging, Nomad scheduling and the Docker-based deployment pipeline.","answer":"One of the clearer pieces of current work in the scientific-instruments space is a cloud-onboarding engagement for a chromatography data system. The objective was to onboard the software to a cloud environment so that instrument data could be visualised remotely, for users who are not standing at the instrument. My contribution sits in the architecture-evaluation and solutioning side of it: working out what the remote-visualization architecture has to look like for lab users, what the constraints on instrument data are, and turning that into a technical proposal the customer and their engineers could actually act on. The engagement also gave me hands-on association with the cloud-integration fabric — NATS messaging and Nomad scheduling on the cloud side — with the deployment baseline built on Docker and CI/CD pipelines. It is a good example of the presales half of this role — an unfamiliar domain, real constraints on how the data is held, and an answer that has to satisfy both the business and the engineers who would run it.","evidence":["My specific responsibility in the technical evaluation.","How the remote-visualization workflow operated in practice.","The principal constraints that shaped the proposal."],"followups":["Domains","Cloud onboarding","Projects"]},{"id":"selected-healthcare","title":"Healthcare & Life Sciences Modernization","aliases":["healthcare modernization","scientific instruments project","life sciences projects","what healthcare work has he done","react proof of concept","health insurance application","insurance application modernization"],"tags":["projects","industry domains"],"summary":"Defined the frontend modernization approach for a legacy health-insurance application, validating an incremental React conversion through a proof of concept.","challenge":"The application needed modernizing, but its business functionality had to stay available throughout.","contribution":"I led the frontend modernization approach and validated the incremental React conversion through a proof of concept.","approach":"The proof of concept fixed the migration boundary — which parts of the interface could move to React while the rest of the application kept running — and tested that a slice could be converted without disrupting the live system.","outcome":"It demonstrated that the application could be modernized incrementally rather than all at once, which is what makes modernization a decision a business can actually take.","detail":"Migration boundaries and coexistence with the existing functionality, the component strategy for the converted slice, and how the conversion was validated.","answer":"Healthcare and life sciences are where I have pushed modernization hardest. At a US health-insurance platform I led hands-on React modernization of a legacy insurance application, validated through an incremental-conversion proof of concept that showed a slice could be converted without disrupting the running system. Alongside that, I have done UI architecture evaluation for a global scientific-instruments manufacturer — data chromatography and analytical systems where the interface has to make dense, instrument-driven workflows usable — most concretely the chromatography cloud-onboarding engagement for remote visualization. The common thread is working inside real constraints — an estate that cannot be paused — and moving it forward in slices that keep the business running.","evidence":["The scope of the proof of concept — which screens or workflows it covered.","Whether the approach informed a subsequent implementation decision.","Any measured performance or maintainability improvement."],"followups":["Domains","Healthcare modernization","Modernization"]},{"id":"selected-architecture","title":"Architecture at Scale — Genetic-Testing Platform","aliases":["genetic platform","genetics platform","petabyte scale","scalability","data volumes","scientific analysis pipelines","genetics architecture"],"tags":["projects"],"summary":"Defined the frontend architecture for a genetic-testing platform processing very large volumes of scientific and diagnostic data.","challenge":"A standardized genetic platform had to serve both diagnostics and research workflows, with data volumes well beyond a conventional web application.","contribution":"I defined the frontend architecture for the platform, and how complex scientific workflows were represented in the interface.","approach":"The architecture separated presentation from the volume of the underlying data — deciding which data the frontend actually needed, and rendering that rather than the full dataset — so the interface stayed responsive while the platform's overall data scale kept growing.","outcome":"A reusable frontend architecture that could absorb new tests, new workflows and new laboratories without rework.","detail":"How complex scientific workflows were represented in the UI, the split of responsibility between frontend and backend, the trade-offs between performance, usability and maintainability, and how the architecture accommodated additional tests and laboratories.","answer":"At a US genetics-testing company I defined the frontend architecture for a standardized genetic platform handling very large data volumes, with scientific analysis pipelines feeding diagnostics and research use. The work was about making an architecture that holds up when the data is enormous and the workflows are scientific rather than commercial: standardising how analyses are presented, keeping the interface usable against dense data, and making sure the platform could scale to new tests and new labs without rework. It is the clearest example of architecture decisions made against real scalability constraints rather than abstract ones.","evidence":["The volume of data actually rendered in the browser, as distinct from the platform's overall data scale.","How new tests, workflows or laboratories were absorbed.","Any measured performance outcome."],"followups":["Projects","Genetics platform","Tech stack"]},{"id":"selected-engineering","title":"Engineering Excellence & Delivery","aliases":["guardrails","technical stories","engineering standards","workflow documentation","cases development module","engineering practices","how does he improve a codebase","code quality"],"tags":["projects","leadership"],"answer":"Alongside architecture, I spend time on the work that makes delivery sustainable: establishing guardrails so teams can move faster without a review bottleneck, writing better technical stories so estimates and acceptance criteria stop drifting, documenting application workflows so the knowledge survives the people who built it, and rebuilding the cases development module to make a core workflow tractable again. None of it is glamorous work; all of it is what separates a codebase that ages well from one that doesn't.","followups":["Projects","Leadership","Competencies"],"related":["soft-skills","core-stack","chapter-5-architect","selected-evidence"]},{"id":"selected-hrp-claims","title":"AI-Assisted Claims Recommendation — Proposal & PoC for an HR Platform","aliases":["hrp claims","hrp plugin","ai claims recommendation","claims recommendation","claims recommender","hrp proposal","claims plugin","ai assisted claims","hrp claims recommendation","claims recommendation plugin","eligibility recommendation","claims decision ai"],"tags":["projects","AI-assisted engineering"],"summary":"Solutioned and won a 2025 proposal for an AI-assisted claims-recommendation plugin for an HR platform — a rules + ML hybrid that recommends eligibility decisions on employee claims, with a demonstrated proof of concept.","challenge":"Claims on an HR platform — reimbursements, benefits, insurance — were reviewed manually against plan rules that vary by policy, geography and dependent status. The client wanted faster, more consistent decisions without losing governance: no black-box approvals, no silent rule drift. The proposal had to show an AI approach the business could defend.","contribution":"I led the proof of concept end to end and shaped the solution story: how the recommendation engine splits responsibility between deterministic rules and learned patterns, what the reviewer sees for each recommendation, how the plugin embeds in the existing HRP interface, and what it means operationally. I prepared the architecture diagrams for the proposal, and collaborated with the domain team on entitlement logic and with the sales team on how the case gets heard in the room.","approach":"The heart of the design is a deliberate split: a deterministic eligibility engine owns the hard constraints — plan rules, policy limits, dependent entitlements — and an ML recommendation layer sits on top for the judgement calls, learning from historical outcomes. Every recommendation arrives with its grounds — the rule that fired or the pattern that matched — so a reviewer can trust, correct and audit it. The PoC ran the recommendation flow inside the actual claims journey of the HRP UI, as a plugin rather than a separate portal.","outcome":"The proposal was won. The client's claims process now moves from manual review toward an explainable, AI-assisted decision flow — and the work was recognized with the Most Valuable Player award in the Architect category, 2025.","detail":"How the rules engine and the ML layer split each decision, the explainability and audit story for reviewers, how the plugin embeds into the existing HRP interface, and how the PoC demonstrated the recommendation flow to the client.","answer":"The proposal work I am proudest of from 2025: an AI-assisted claims recommendation plugin for an HR platform. Employees submit claims — reimbursements, benefits, insurance — and the plugin recommends the decision: what proportion is payable, which rules apply, what needs a reviewer's eye, with the reasoning attached. The solution is deliberately a hybrid — a deterministic eligibility engine enforces the hard plan rules, and an ML layer learns from historical outcomes to handle the judgement calls — so recommendations stay explainable and auditable rather than black-box. I led the proof of concept, prepared the architecture diagrams for the proposal, and collaborated with the domain and sales teams to carry the case. The proposal was won, and the work was recognized with the Most Valuable Player award in the Architect category, 2025. It is the clearest example of what I keep finding myself saying about AI in engineering: it earns its place only inside structure — clear rules, disciplined process, honest review.","evidence":["How each decision is split between the deterministic eligibility engine and the ML layer.","The explainability shown for a recommendation — which rule fired or which pattern matched.","How the PoC embedded in the HRP claims journey as a plugin.","The link between this work and the Most Valuable Player award, 2025."],"followups":["AI engineering","Certifications & awards","Competencies"],"related":["selected-evidence","impact","current-persistent"]}]},"employmentHistory":{"label":"Employment History","entries":[{"id":"employment-history","title":"Employment History at a Glance","aliases":["employment history","work history","career history","his employment","where has he worked","job history","employers","all roles","roles and companies","your employment","where have you worked"],"tags":["employment"],"answer":"The arc, in one pass. 2002–2005 — multimedia programming and interactive applications, at Integrated Research and Consultancy and then Aesthetic Technologies. 2005–2012 — product engineering, e-learning platforms and team leadership, at Brainvisa Technologies (now Encora), Digital Domain India, NIIT and Aptara. 2012–2017 — independent consulting and individual-contributor delivery across media and entertainment, banking, publishing, workforce software, insurance and market research, modernizing legacy applications along the way. 2017–2021 — frontend engineering, UI/UX and technical leadership at Conscience IT and Wizard Communication. From November 2021 — senior architecture, enterprise modernization and presales, first in healthcare and life sciences and now with Persistent Systems. In-house, individual contractor, and embedded with customer teams as an enabler.","followups":["Employment","Career path","Current work"],"related":["chapter-1-foundation","chapter-5-architect","current-persistent","emp-early-career"]},{"id":"emp-persistent","title":"Persistent Systems — Senior Architect (2023–Present)","aliases":["recent experience","current company","last job","where do you work now"],"tags":["employment","recent work"],"answer":"Senior Architect with Persistent Systems, engaged with one of the largest healthcare payers and providers in the US: consulting, solutioning and team supervision for a large-scale legacy migration. Earlier in 2023 I also delivered presales architecture engagements — for a global life-sciences data company, a scientific-instruments manufacturer, a care-management provider, and a brief stint with a health-tech startup on a remote patient monitoring system for elders.","followups":["Current work","Projects","AI engineering"],"related":["current-persistent","current-modernization","emp-payer-genetics"]},{"id":"emp-payer-genetics","summary":"Architect and lead across healthcare and genetics platforms — React modernization of a legacy insurance application, and frontend architecture for a genetic-testing platform handling very large data volumes.","role":"Architect / Lead, Frontend","org":"US health-insurance platform · US genetics-testing company","period":"Dec 2021 – Nov 2022","title":"Healthcare & Genetics Platforms — Architect Roles (2021–2022)","aliases":["genetics","2021 2022","iiflw","bsfi","digital transformation proposal","payer platform","insurance platform"],"tags":["employment"],"answer":"At a US health-insurance platform (Jun–Nov 2022) I led hands-on React modernization of a legacy insurance application, validated through an incremental-conversion PoC. At a US genetics-testing company (Dec 2021–Jun 2022) I defined the frontend architecture for a standardized genetic platform supporting petabyte-scale data with scientific analysis pipelines for diagnostics and research. I also shaped an RFP for a digital-transformation proposal for a banking, financial services and insurance customer.","followups":["Projects","Healthcare modernization","Genetics platform"],"related":["emp-persistent","domain-healthcare","current-modernization"]},{"id":"emp-wizard-conscience","summary":"Led frontend teams delivering custom e-commerce, healthcare and e-learning products, moving from implementation into UI architecture, technology evaluation and solution design.","role":"Team Lead UI/UX · Senior Technical Consultant","org":"Conscience IT · Wizard Communication","period":"Feb 2017 – Jul 2021","title":"Wizard Communication & Conscience IT (2017–2021)","aliases":["conscience","ecommerce","elearning lead","2017 2021","adapt framework"],"tags":["employment","leadership","career"],"answer":"At Wizard Communication (2019–2021) I led frontend teams building custom e-commerce and healthcare products, with exposure to Industry 4.0 solutions. At Conscience IT (2017–2019) I led UI/UX delivery for bespoke products and e-learning services — building third-party plugins for the Adapt framework, simulation-based learning ware for a leading enterprise learning platform, Moodle and Blackboard LMS work, plus apps for desktop and low-end Raspberry Pi devices.","followups":["Employment","Leadership","Tech stack"],"related":["domain-others","emp-freelance","soft-skills"]},{"id":"emp-freelance","summary":"Five years of independent consulting and individual-contributor delivery across six industries, modernizing Flash-based legacy applications along the way.","role":"Consultant / Technical Advisor","org":"Independent Consulting","period":"2012 – 2017","title":"Independent Consulting & Freelance (2012–2017)","aliases":["freelance","consultant","consulting","clients","2012 2017","independent contractor","advisor"],"tags":["employment","modernization"],"answer":"For five years I consulted for global organizations across media and entertainment, banking, academic publishing, workforce software, insurance brokerage and market research — wearing hats from technical advisor to individual contractor, and modernizing multiple Flash-based legacy applications. The engagements ran through global freelance marketplaces as well as direct contracts.","followups":["Employment","Modernization","Domains"],"related":["emp-wizard-conscience","domain-others","current-modernization"]},{"id":"emp-early-career","summary":"The first decade in multimedia and e-learning — interactive 3D presentations, CD-ROM applications, an e-learning automation product, simulations and learning platforms, across six employers.","role":"Multimedia Programmer → Technology Manager","org":"Integrated Research · Aesthetic Technologies · Brainvisa (Encora) · Digital Domain · NIIT · Aptara","period":"Nov 2002 – Sep 2012","title":"Early Career — Multimedia & E-Learning (2002–2012)","aliases":["early career","e-learning history","multimedia","beginnings","first job","flash","3d interactivities"],"tags":["employment","career"],"answer":"The first decade was spent making software that taught people: interactive 3D presentations, CD-ROM applications and rich-media websites for national and international clients, then product engineering at Brainvisa Technologies (now Encora), Digital Domain India, NIIT and Aptara — an e-learning automation product that turned Word content into courseware, interactive simulations and game-based learning applications, a desktop media-center product, and the technical and business-development support behind e-learning engagements, including an in-house training academy for a global audit-and-advisory firm.","followups":["Employment","Projects","Education"],"related":["domain-others","education","interests"]}]},"s s a peer — suggesting usability refinements that make an experience richer for users without weighing on performance. SCRUM-certified and an ardent Agile follower.","followups":["Leadership","Competencies","Current work"],"related":["open-to-work","current-persistent","ai-toolset"]}]},"domainExpertise":{"label":"Domain Expertise","entries":[{"id":"domain-healthcare","title":"HealthCare & Life Sciences","aliases":["healthcare","health","life sciences","hls domain","medical","genomics","pharma","hipaa","payer","provider","health tech","patient monitoring","diagnostics"],"tags":["industry domains"],"answer":"Healthcare is my deepest domain: umbrella consolidation for one of the largest US healthcare payers, remote patient monitoring for a health-tech startup, genetic-testing platforms at petabyte scale, health-insurance modernization, care-management evaluation for a social-care solutions provider, and UI architecture evaluation for scientific instruments and analytical systems. Working familiarity with HIPAA constraints.","followups":["Domains","Healthcare modernization","Projects"],"related":["emp-payer-genetics","current-persistent","emp-persistent"]},{"id":"domain-others","title":"E-Commerce, Gaming, E-Learning & Fintech","aliases":["industries","gaming","elearning","fintech","banking","lms","scorm","education","k12","k-12"],"tags":["industry domains"],"answer":"Beyond healthcare: custom e-commerce products, game-based learning and simulations for a leading enterprise learning platform, K-12 curriculum work in early e-learning, bank and fintech RFPs (a global bank, and a BSFI customer), and Industry 4.0 exposure. LMS ecosystems — Moodle, Blackboard, SCORM and the Adapt framework — round out the e-learning depth.","followups":["Domains","Employment","Projects"],"related":["emp-wizard-conscience","emp-freelance","emp-early-career"]}]},"education":{"label":"Education & Certifications","entries":[{"id":"education","title":"Education","aliases":["degree","diploma","qualification","study","fine arts","college","school","university","education and certifications"],"tags":["education"],"answer":"Diplomas in Fine Arts and in Multimedia — a creative foundation that still shows in how I approach UI, motion and user experience.","followups":["Education","Interests"],"related":["certifications","interests"]},{"id":"certifications","title":"Certifications & awards","aliases":["certified","certification","awards","award","recognition","best player","google cloud","cloud security","gcp certification","training","courses","what are you learning"],"tags":["certifications","education","AI-assisted engineering"],"answer":"Certified across cloud, AI tooling and user experience — with Persistent's internal programs behind them, and one honour worth its own row. The lot, at a glance:","followups":["Education","AI engineering"],"related":["ai-toolset","education"],"table":[{"term":"Google Cloud Digital Leader","value":"Google Cloud"},{"term":"AWS Certified AI Practitioner","value":"Amazon Web Services"},{"term":"Cloud Security Competency","value":"Cloud security"},{"term":"User Experience with AI Competency (Level 4)","value":"User-experience competency"},{"term":"Cursor AI · VS Code · Whisperer · GitHub Copilot","value":"AI tooling — IDE certificates"},{"term":"Propellor program · AI QuadLift","value":"Persistent — internal programs"},{"term":"Most Valuable Player in Architect category, 2025","value":"Persistent","award":true}]}]},"interestsPassion":{"label":"Interests & Passion","entries":[{"id":"interests","title":"Interests & Passion","aliases":["passion","hobbies","what drives you","art","drawing","painting","side projects","outside work","what excites you"],"tags":["interests"],"answer":"A fine-arts foundation keeps me passionate about simplicity and elegance in complex interfaces. Professionally, I am energized by the AI shift — exploring agent harnesses, local model setups and what an 'Agentic Development Lifecycle' means for how teams build
